{% extends "layout.html" %}

{% block title %}create-list{% endblock %}

{% block body %}
<div class="flex justify-end">
  <button class="bg-blue-400 hover:bg-blue-600 text-black hover:text-white text-lg px-4 py-2 rounded-2xl">
    <a href="/customer-create">Add</a>
  </button>
</div>
  <table class="border-collapse table-fixed border border-gray-400">
        <thead>
            <tr>
                <th class="border border-gray-500 bg-gray-300 px-4 py-4 m-3">S.N</th>
                <th class="border border-gray-500 bg-gray-300 px-10 py-4 m-3">Customer Name</th>
                <th class="border border-gray-500 bg-gray-300 px-10 py-4 m-3">Email</th>
                <th class="border border-gray-500 bg-gray-300 px-10 py-4 m-3">Address</th>
                <th class="border border-gray-500 bg-gray-300 px-6 py-4 m-3">Update</th>
                <th class="border border-gray-500 bg-gray-300 px-6 py-4 m-3">Delete</th>

            </tr>
        </thead>
        <tbody>
            {% for customer in customers %}
            <tr>
                <td class="border border-gray-300 px-4 py-3 m-3" >{{ customer.id }}</td>
                <td class="border border-gray-300 px-10 py-3 m-3" >{{ customer.username }}</td>
                <td class="border border-gray-300 px-10 py-3 m-3" >{{ customer.email }}</td>
                <td class="border border-gray-300 px-10 py-3 m-3" >{{ customer.address }}</td>
                <td class="border border-gray-300 px-6 py-3 m-3" >
                <a class="text-blue-700" href="{{ url_for('update_customer', id=customer.id) }}">Update</a>
                </td>
                <td class="border border-gray-300 px-6 py-3">
                    <button onclick="onDelete({{ customer.id }})" class="text-red-700">Delete</button>
                </td>

            </tr>
            {% endfor %}
        </tbody>
     </table>
    <script>
     function onDelete(customerId){
        const confirmed = window.confirm('Are you sure you want to delete this customer?');
        if (confirmed){
            window.location.href = `/customer/${customerId}/delete`;
        }
    }
    </script>
{% endblock %}
