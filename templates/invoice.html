{% extends "layout.html" %}
{% block title %}Invoice{% endblock %}

{% block body %}
<div class="p-4">
  <form action="/invoice" method="post" id="invoiceForm">
    <div class="mb-3">
      <label>Invoice Number</label>
      <input type="text" name="invoice_number" value="INV-00" required class="w-full p-2 border" />
    </div>

    <div class="mb-3">
      <label>Customer</label>
      <input type="text" name="customer" required class="w-full p-2 border" />
    </div>

    <div class="mb-3">
      <label>Total Amount</label>
      <input type="text" id="totalAmount" name="tota_amount" readonly class="w-full p-2 border bg-gray-50" />
    </div>

    <div class="mb-3">
      <label>Invoice Date</label>
      <input type="date" name="invoice_date" class="w-full p-2 border bg-gray-50" />
    </div>

    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded">Submit</button>

    <table id="invoiceTable" class="w-full mt-4 border-collapse">
      <thead>
        <tr>
          <th class="border px-2">Item Name</th>
          <th class="border px-2">Unit Price</th>
          <th class="border px-2">Quantity</th>
          <th class="border px-2">Amount</th>
          <th class="border px-2">Actions</th>
        </tr>
      </thead>
      <tbody id="invoiceTbody"></tbody>
    </table>

    <button id="addItemBtn" type="button" class="mt-3 px-3 py-2 bg-green-600 text-white rounded">Add Item</button>
  </form>

  <!-- overlay + dialog -->
  <div id="overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:40;"></div>

  <div id="itemDialog" style="display:none; position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); background:#fff; padding:18px; border-radius:8px; z-index:50; width:320px; box-shadow:0 8px 24px rgba(0,0,0,0.2);">
    <h3 class="mb-2">Add Item</h3>

    <label>Item Name</label>
    <select id="itemSelect" class="w-full p-1 border mb-2">
      {% for item in items %}
      <option value="{{ item.item_name }}" data-price="{{ item.unit_price }}">{{ item.item_name }}</option>
      {% endfor %}
    </select>

    <label>Quantity</label>
    <input id="itemQty" type="number" min="1" value="1" class="w-full p-1 border mb-2" />

    <label>Unit Price</label>
    <input id="itemPrice" type="number" min="0" step="0.01" class="w-full p-1 border mb-3" />

    <div class="flex justify-end gap-2">
      <button id="saveItemBtn" type="button" class="px-3 py-1 bg-blue-600 text-white rounded">Save</button>
      <button id="closeDialogBtn" type="button" class="px-3 py-1 bg-gray-400 text-white rounded">Close</button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const addItemBtn = document.getElementById('addItemBtn');
  const overlay = document.getElementById('overlay');
  const itemDialog = document.getElementById('itemDialog');
  const closeDialogBtn = document.getElementById('closeDialogBtn');
  const saveItemBtn = document.getElementById('saveItemBtn');

  const itemSelect = document.getElementById('itemSelect');
  const itemQtyInput = document.getElementById('itemQty');
  const itemPriceInput = document.getElementById('itemPrice');

  const tbody = document.getElementById('invoiceTbody');
  const totalAmountInput = document.getElementById('totalAmount');

  let items = [];

  function openDialog() {
    overlay.style.display = 'block';
    itemDialog.style.display = 'block';
    itemSelect.focus();
  }
  function closeDialog() {
    overlay.style.display = 'none';
    itemDialog.style.display = 'none';
    itemQtyInput.value = 1;
  }

  function recalcAndSave() {
    const grandTotal = items.reduce((sum, it) => sum + (it.qty * it.price), 0);
    totalAmountInput.value = grandTotal.toFixed(2);
  }

  function renderTable() {
    tbody.innerHTML = '';
    items.forEach((it, idx) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="border px-2">
          ${escapeHtml(it.name)}
          <input type="hidden" name="item_name[]" value="${escapeHtml(it.name)}" />
        </td>
        <td class="border px-2 text-right">
          ${it.price.toFixed(2)}
          <input type="hidden" name="price[]" value="${it.price}" />
        </td>
        <td class="border px-2 text-center">
          ${it.qty}
          <input type="hidden" name="qty[]" value="${it.qty}" />
        </td>
        <td class="border px-2 text-right">${(it.qty * it.price).toFixed(2)}</td>
        <td class="border px-2 text-center">
          <button type="button" data-idx="${idx}" class="delete-row px-2 py-1 bg-red-500 text-white rounded">Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function saveItem() {
    const selectedOption = itemSelect.options[itemSelect.selectedIndex];
    const name = selectedOption.value;
    const price = parseFloat(itemPriceInput.value) || 0;
    const qty = parseInt(itemQtyInput.value, 10) || 0;

    if (!name || qty <= 0 || price <= 0) {
      alert('Please enter valid quantity and price.');
      return;
    }

    items.push({ name, qty, price });
    renderTable();
    recalcAndSave();
    closeDialog();
  }

  tbody.addEventListener('click', function (e) {
    const btn = e.target.closest('.delete-row');
    if (!btn) return;
    const idx = Number(btn.getAttribute('data-idx'));
    if (!Number.isNaN(idx)) {
      items.splice(idx, 1);
      renderTable();
      recalcAndSave();
    }
  });

  function escapeHtml(str) {
    return String(str)
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'",'&#39;');
  }

  addItemBtn.addEventListener('click', openDialog);
  closeDialogBtn.addEventListener('click', closeDialog);
  saveItemBtn.addEventListener('click', saveItem);
  overlay.addEventListener('click', closeDialog);

  itemSelect.addEventListener("change", function () {
    let selectedOption = this.options[this.selectedIndex];
    itemPriceInput.value = selectedOption.getAttribute("data-price");
  });

  if (itemSelect.options.length > 0) {
    itemPriceInput.value = itemSelect.options[0].getAttribute("data-price");
  }
});
</script>
{% endblock %}
