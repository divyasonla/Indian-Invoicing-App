{% extends "layout.html" %}
{% block title %}Login{% endblock %}

{% block body %}
<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-md">
    <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">Login</h1>

    <form action="/login" method="POST" class="space-y-5">
      <div>
        <label class="block text-gray-700 font-medium mb-1" for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Enter your username"
               class="w-full px-4 py-2 border rounded-lg " required>
      </div>

      <div>
        <label class="block text-gray-700 font-medium mb-1" for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter your password"
               class="w-full px-4 py-2 border rounded-lg " required>
      </div>

      <button type="submit"
              class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 rounded-lg ">
        Login
      </button>
    </form>

    <p class="text-center text-gray-600 mt-4">
      Don't have an account? 
      <a href="/register" class="text-blue-600 hover:underline">Register</a>
    </p>
  </div>
</div>
{% endblock %}
