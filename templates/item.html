{% extends "layout.html" %}
{% block title %}Item{% endblock %}

{% block body %}
<div class="flex items-center justify-center min-h-screen bg-amber-100">
  <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-md">
  <form action="/item" method="post">
    <div class="text-left">
      <label class="block text-gray-700 font-medium mb-1">Item Name</label>
      <input 
          class="w-full border-2 border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
         type="text" name="item_name" placeholder="Item Name" required>
    </div>
    <div class="text-left">
      <label class="block text-gray-700 font-medium mb-1">Unit Price</label>
      <input 
          class="w-full border-2 border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
          type="text" name="unit_price" placeholder="Unit Price" required>

    </div>
    <div class="text-left">
      <label class="block text-gray-700 font-medium mb-1">Quantity</label>
      
         <input 
          class="w-full border-2 border-gray-300 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
          type="number" name="quantity" placeholder="Quantity" required>

    </div>
    <!-- <input type="text" name="item_name" placeholder="Item Name" required><br> -->
    <!-- <input type="text" name="invoice" placeholder="Invoice" required><br> -->
    <!-- <input type="text" name="unit_price" placeholder="Unit Price" required><br> -->
    <!-- <input type="number" name="quantity" placeholder="Quantity" required> -->
    <button 
      class="w-full bg-blue-500 text-white font-semibold py-2 rounded-lg shadow-md hover:bg-blue-600 transition"    
      type="submit">Submit
    </button>
  </form>
  </div>
</div>
{% endblock %}
