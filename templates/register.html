{% extends "layout.html" %}
{% block title %}Register{% endblock %}

{% block body %}
<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-md">
    <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">Sign Up</h1>
    <form action="/register" method="POST" class="space-y-5">
      
      <div>
        <label class="block text-gray-700 font-medium mb-1" for="username">Name</label>
        <input id="username" name="username" type="text" placeholder="Enter your name"
               class="w-full px-4 py-2 border rounded-lg " required>
      </div>
      
      <div>
        <label class="block text-gray-700 font-medium mb-1" for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter your password"
               class="w-full px-4 py-2 border rounded-lg " required>
      </div>
      
      <div>
        <label class="block text-gray-700 font-medium mb-1" for="confirmed">Confirm Password</label>
        <input id="confirmed" name="confirmed" type="password" placeholder="Confirm your password"
               class="w-full px-4 py-2 border rounded-lg " required>
      </div>

      <button type="submit"
              class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 rounded-lg ">
        Register
      </button>
    </form>

    <p class="text-center text-gray-600 mt-4">
      Already signed up? 
      <a href="/login" class="text-blue-600 hover:underline">Login</a>
    </p>
  </div>
</div>
{% endblock %}
