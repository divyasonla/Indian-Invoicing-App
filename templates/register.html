{% extends "layout.html" %}
{% block title %}Register{% endblock %}
{% block body %}
    <div>
        <form action="/register", method="POST" class="flex-xl text-center bg-gray-200 border-2 rounded-lg shadow-md p-7 w-1/2 mx-auto space-y-3">
            <div class="block mb-1">
            <input class="border-2 p-2 w-1/2 rounded" type="text" name="username" placeholder="UserName" required>
    
            </div>
            <div class="block mb-1">
            <input class="border-2 p-2 w-1/2 rounded" type="password" name="password" placeholder="password" required>
    
            </div>
            <div class="block mb-1">
            <input class="border-2 p-2 w-1/2 rounded" type="password" name="confirmed" placeholder="confirmed" required>
    
            </div>
            <!-- <div class="items-center"> -->
            <button class="bg-blue-400 hover:bg-blue-600 rounded-xl px-4 py-2 mx-auto p-2 text-white" type="submit">Register</button>
    
            <!-- </div> -->
            <p> If you are alrady singup please <a class="text-blue-800" href="/login">Login</a></p>
    
        </form>
    </div>
{% endblock %}
